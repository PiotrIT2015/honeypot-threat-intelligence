filebeat.inputs:

  - type: filestream

    id: cowrie-events

    enabled: true

    paths:
      - /usr/share/filebeat/logs/events.jsonl

    parsers:
      - ndjson:
          target: ""
          add_error_key: true

    fields:
      source: cowrie
      project: honeypot-threat-intelligence

    fields_under_root: true


output.logstash:

  hosts:
    - "logstash:5044"


logging.level: info