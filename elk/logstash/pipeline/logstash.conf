input {

  beats {

    port => 5044

  }

}


filter {

  mutate {

    add_field => {
      "[@metadata][source]" => "cowrie"
    }

  }

  date {

    match => [
      "timestamp",
      "ISO8601"
    ]

    target => "@timestamp"

  }

  mutate {

    add_field => {
      "ingestion_pipeline" => "honeypot-threat-intelligence"
    }

  }

}


output {

  elasticsearch {

    hosts => [
      "http://elasticsearch:9200"
    ]

    index => "cowrie-events-%{+YYYY.MM.dd}"

  }

  stdout {

    codec => rubydebug

  }

}