services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: honeypot-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "127.0.0.1:9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    container_name: honeypot-kibana

    depends_on:
      elasticsearch:
        condition: service_healthy

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    ports:
      - "127.0.0.1:5601:5601"

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.6
    container_name: honeypot-logstash

    depends_on:
      elasticsearch:
        condition: service_healthy

    volumes:
      - ./elk/logstash/pipeline:/usr/share/logstash/pipeline:ro

    ports:
      - "127.0.0.1:5044:5044"

  filebeat:
    image: docker.elastic.co/beats/filebeat:9.5.6
    container_name: honeypot-filebeat

    user: root

    depends_on:
      - logstash

    command:
      - filebeat
      - -e
      - --strict.perms=false

    volumes:
      - ./elk/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./data/processed:/usr/share/filebeat/logs:ro
      - filebeat_data:/usr/share/filebeat/data

volumes:
  elasticsearch_data:
  filebeat_data: